name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTUP_DIST_SERVER: https://rustup-downloads-disabled.invalid

jobs:
  portability:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Isolate Cargo home in ephemeral storage
        shell: bash
        run: echo "CARGO_HOME=${RUNNER_TEMP}/cargo-home" >> "$GITHUB_ENV"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Rust toolchain
        shell: bash
        env:
          MACOS_ARM64_CARGO_SHA256: 545517d16ac76789aa6ce801cbc3eeecc9acaf43f3ccb63148c3577f2bb4b8d3
          MACOS_ARM64_RUSTC_SHA256: 6d2cf6164bef00ff3d2c37ca0a0658ffb7c9c3178882a72d78e35abeba888860
          MACOS_ARM64_STD_SHA256: 1f729f8ba21725618ab894f14cc38f01470f1d15ea76a81fac2da63291bed75c
          MACOS_X64_CARGO_SHA256: 81fabf0d783af844c7dd74dfe10d0302dd063775789a914f29b33e3d46ee1cf0
          MACOS_X64_RUSTC_SHA256: 04f3acf7ddfb998fa2713226fd8528e6157b9030f9a6ac6678133d82d5c099f9
          MACOS_X64_STD_SHA256: 09780642e83b12085500ea78dcb46112a546467352cc4a4dd229f22e03d4a5f0
          WINDOWS_X64_CARGO_SHA256: 8c0a40a5411746ff6600d93acd16652fef56702196bb25b940ff399d7e107f40
          WINDOWS_X64_RUSTC_SHA256: 76f70bbd3dc8681ee189931bc5e270cd9524ff3d17738d87f609bba4980c466c
          WINDOWS_X64_STD_SHA256: ba81500406fdf8a3a81078df2129bd6e4793b579c9e1a498563670bccad92611
        run: |
          set -euo pipefail

          case "${RUNNER_OS}-$(uname -m)" in
            macOS-arm64)
              rust_target=aarch64-apple-darwin
              cargo_sha256="${MACOS_ARM64_CARGO_SHA256}"
              rustc_sha256="${MACOS_ARM64_RUSTC_SHA256}"
              std_sha256="${MACOS_ARM64_STD_SHA256}"
              ;;
            macOS-x86_64)
              rust_target=x86_64-apple-darwin
              cargo_sha256="${MACOS_X64_CARGO_SHA256}"
              rustc_sha256="${MACOS_X64_RUSTC_SHA256}"
              std_sha256="${MACOS_X64_STD_SHA256}"
              ;;
            Windows-x86_64)
              rust_target=x86_64-pc-windows-msvc
              cargo_sha256="${WINDOWS_X64_CARGO_SHA256}"
              rustc_sha256="${WINDOWS_X64_RUSTC_SHA256}"
              std_sha256="${WINDOWS_X64_STD_SHA256}"
              ;;
            *)
              echo "Unsupported runner architecture: ${RUNNER_OS}-$(uname -m)" >&2
              exit 1
              ;;
          esac

          runner_temp="${RUNNER_TEMP}"
          if [[ "${RUNNER_OS}" == Windows ]]; then
            runner_temp="$(cygpath -u "${RUNNER_TEMP}")"
          fi

          toolchain_root="${runner_temp}/rust-1.89.0-${rust_target}"
          install -d -m 0755 "${toolchain_root}"

          install_component() {
            component_name="$1"
            component_sha256="$2"
            archive="${runner_temp}/${component_name}-1.89.0-${rust_target}.tar.xz"
            component_dir="${runner_temp}/${component_name}-${rust_target}"
            component_url="https://static.rust-lang.org/dist/2025-08-07/${component_name}-1.89.0-${rust_target}.tar.xz"

            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
              --output "${archive}" "${component_url}"
            if [[ "${RUNNER_OS}" == macOS ]]; then
              echo "${component_sha256}  ${archive}" | shasum -a 256 --check
            else
              echo "${component_sha256}  ${archive}" | sha256sum --check --strict
            fi
            install -d -m 0755 "${component_dir}"
            tar --extract --xz --file "${archive}" --directory "${component_dir}" \
              --strip-components 1
            sh "${component_dir}/install.sh" --prefix="${toolchain_root}" --disable-ldconfig
          }

          install_component rustc "${rustc_sha256}"
          install_component cargo "${cargo_sha256}"
          install_component rust-std "${std_sha256}"

          export PATH="${toolchain_root}/bin:${PATH}"
          if [[ "${RUNNER_OS}" == Windows ]]; then
            cygpath -w "${toolchain_root}/bin" >> "${GITHUB_PATH}"
          else
            echo "${toolchain_root}/bin" >> "${GITHUB_PATH}"
          fi
          rustc_version="$(rustc --version --verbose)"
          cargo_version="$(cargo --version --verbose)"
          echo "${rustc_version}"
          echo "${cargo_version}"
          grep --fixed-strings --line-regexp 'release: 1.89.0' <<< "${rustc_version}"
          grep --fixed-strings --line-regexp "host: ${rust_target}" <<< "${rustc_version}"
          grep --fixed-strings --line-regexp 'release: 1.89.0' <<< "${cargo_version}"
          grep --fixed-strings --line-regexp "host: ${rust_target}" <<< "${cargo_version}"
      - name: Run tests
        run: cargo test --locked --all-features
      - name: Analyze all targets
        run: cargo check --locked --all-targets --all-features

  quality:
    name: Format, lint, test
    runs-on: ubuntu-24.04
    container:
      image: rust:1.89.0-bookworm@sha256:c9ac3fa8945b61dede1e4500d25028aa8fd8a8fe46365fcf9c0422f8d999b9b0
    env:
      RUSTUP_TOOLCHAIN: 1.89.0-x86_64-unknown-linux-gnu
    timeout-minutes: 20
    steps:
      - name: Isolate Cargo home in ephemeral storage
        shell: bash
        run: echo "CARGO_HOME=${RUNNER_TEMP}/cargo-home" >> "$GITHUB_ENV"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Rust components
        shell: bash
        env:
          CLIPPY_SHA256: c6c362c6cd74567022e9ba0c16f6676f8c2b73d955adcf1f6f4c51cf15e57ce8
          CLIPPY_URL: https://static.rust-lang.org/dist/2025-08-07/clippy-1.89.0-x86_64-unknown-linux-gnu.tar.xz
          LLVM_TOOLS_SHA256: bb0ced899fd1ac628f26e375adabc970b415c516ec82fb7cf9ac3c63cb4d0fee
          LLVM_TOOLS_URL: https://static.rust-lang.org/dist/2025-08-07/llvm-tools-1.89.0-x86_64-unknown-linux-gnu.tar.xz
          RUSTFMT_SHA256: 540eb7adf43e37b22936f981c630b10c63915f64f3c227d981a8b592ece33430
          RUSTFMT_URL: https://static.rust-lang.org/dist/2025-08-07/rustfmt-1.89.0-x86_64-unknown-linux-gnu.tar.xz
        run: |
          set -euo pipefail
          rust_sysroot="$(rustc --print sysroot)"

          install_component() {
            component_name="$1"
            component_url="$2"
            component_sha256="$3"
            archive="${RUNNER_TEMP}/${component_name}.tar.xz"
            component_dir="${RUNNER_TEMP}/${component_name}"

            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
              --output "${archive}" "${component_url}"
            echo "${component_sha256}  ${archive}" | sha256sum --check --strict
            install -d -m 0755 "${component_dir}"
            tar --extract --xz --file "${archive}" --directory "${component_dir}" \
              --strip-components 1
            sh "${component_dir}/install.sh" --prefix="${rust_sysroot}" --disable-ldconfig
          }

          install_component clippy "${CLIPPY_URL}" "${CLIPPY_SHA256}"
          install_component llvm-tools "${LLVM_TOOLS_URL}" "${LLVM_TOOLS_SHA256}"
          install_component rustfmt "${RUSTFMT_URL}" "${RUSTFMT_SHA256}"

          cargo clippy --version
          cargo fmt --version
          rustc_version="$(rustc --version --verbose)"
          cargo_version="$(cargo --version --verbose)"
          grep --fixed-strings --line-regexp 'release: 1.89.0' <<< "${rustc_version}"
          grep --fixed-strings --line-regexp 'host: x86_64-unknown-linux-gnu' \
            <<< "${rustc_version}"
          grep --fixed-strings --line-regexp 'release: 1.89.0' <<< "${cargo_version}"
          grep --fixed-strings --line-regexp 'host: x86_64-unknown-linux-gnu' \
            <<< "${cargo_version}"
          test -x "${rust_sysroot}/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-profdata"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-features
      - name: Install checksum-pinned coverage tool
        shell: bash
        env:
          TOOL_SHA256: b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a
          TOOL_URL: https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          install -d -m 0755 "${RUNNER_TEMP}/dbxctl-tools"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/cargo-llvm-cov.tar.gz" "${TOOL_URL}"
          echo "${TOOL_SHA256}  ${RUNNER_TEMP}/cargo-llvm-cov.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/cargo-llvm-cov.tar.gz" \
            --directory "${RUNNER_TEMP}/dbxctl-tools"
          echo "${RUNNER_TEMP}/dbxctl-tools" >> "${GITHUB_PATH}"
      - name: Measure coverage
        run: cargo llvm-cov --locked --all-features --workspace --ignore-filename-regex '(/rustc/|/tests/)' --fail-under-lines 90
      - name: Analyze all targets
        run: cargo check --locked --all-targets --all-features
      - name: Build dbxctl for upstream contract tests
        run: cargo build --locked
      - name: Download pinned Databricks CLI
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output /tmp/databricks-cli.tar.gz \
            https://github.com/databricks/cli/releases/download/v0.296.0/databricks_cli_0.296.0_linux_amd64.tar.gz
          echo 'cd9fa9748878f35d3c1cdf6b99ac285ce3124117b8839b653a9513b2e87820e6  /tmp/databricks-cli.tar.gz' \
            | sha256sum --check --strict
          mkdir /tmp/databricks-cli
          tar --extract --gzip --file /tmp/databricks-cli.tar.gz --directory /tmp/databricks-cli
      - name: Check pinned upstream passthrough contract
        env:
          DATABRICKS_CLI_PATH: /tmp/databricks-cli/databricks
        run: cargo test --locked --test upstream_contract -- --ignored

  supply-chain:
    name: CVEs, licenses, dependency policy
    runs-on: ubuntu-24.04
    container:
      image: rust:1.89.0-bookworm@sha256:c9ac3fa8945b61dede1e4500d25028aa8fd8a8fe46365fcf9c0422f8d999b9b0
    env:
      RUSTUP_TOOLCHAIN: 1.89.0-x86_64-unknown-linux-gnu
    timeout-minutes: 20
    steps:
      - name: Isolate Cargo home in ephemeral storage
        shell: bash
        run: echo "CARGO_HOME=${RUNNER_TEMP}/cargo-home" >> "$GITHUB_ENV"
      - name: Verify pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc_version="$(rustc --version --verbose)"
          cargo_version="$(cargo --version --verbose)"
          grep --fixed-strings --line-regexp 'release: 1.89.0' <<< "${rustc_version}"
          grep --fixed-strings --line-regexp 'host: x86_64-unknown-linux-gnu' \
            <<< "${rustc_version}"
          grep --fixed-strings --line-regexp 'release: 1.89.0' <<< "${cargo_version}"
          grep --fixed-strings --line-regexp 'host: x86_64-unknown-linux-gnu' \
            <<< "${cargo_version}"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned security tools
        shell: bash
        env:
          AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
          AUDIT_URL: https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          DENY_URL: https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
        run: |
          set -euo pipefail
          install -d -m 0755 "${RUNNER_TEMP}/dbxctl-tools"

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/cargo-audit.tgz" "${AUDIT_URL}"
          echo "${AUDIT_SHA256}  ${RUNNER_TEMP}/cargo-audit.tgz" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/cargo-audit.tgz" \
            --directory "${RUNNER_TEMP}/dbxctl-tools" --strip-components 1 \
            cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/cargo-deny.tar.gz" "${DENY_URL}"
          echo "${DENY_SHA256}  ${RUNNER_TEMP}/cargo-deny.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/cargo-deny.tar.gz" \
            --directory "${RUNNER_TEMP}/dbxctl-tools" --strip-components 1 \
            cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny

          chmod 0755 "${RUNNER_TEMP}/dbxctl-tools/cargo-audit" \
            "${RUNNER_TEMP}/dbxctl-tools/cargo-deny"
          echo "${RUNNER_TEMP}/dbxctl-tools" >> "${GITHUB_PATH}"
      - name: Check RustSec advisories
        run: cargo audit --deny warnings
      - name: Check dependency policy
        run: cargo deny check
