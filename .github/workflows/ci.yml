name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTUP_DIST_SERVER: https://rustup-downloads-disabled.invalid

jobs:
  pins:
    name: Load supply-chain pins
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      json: ${{ steps.pins.outputs.json }}
      rust_image: ${{ steps.pins.outputs.rust_image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and export pins
        id: pins
        run: python3 scripts/update-pins.py --emit-github-output "$GITHUB_OUTPUT"

  portability:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    needs: pins
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Isolate Cargo home in ephemeral storage
        shell: bash
        run: echo "CARGO_HOME=${RUNNER_TEMP}/cargo-home" >> "$GITHUB_ENV"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Rust toolchain
        shell: bash
        env:
          RUST_VERSION: ${{ fromJSON(needs.pins.outputs.json).rust.version }}
          RUST_DIST_DATE: ${{ fromJSON(needs.pins.outputs.json).rust.dist_date }}
          MACOS_ARM64_CARGO_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.standalone['aarch64-apple-darwin']['cargo'] }}
          MACOS_ARM64_RUSTC_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.standalone['aarch64-apple-darwin']['rustc'] }}
          MACOS_ARM64_STD_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.standalone['aarch64-apple-darwin']['rust-std'] }}
          MACOS_X64_CARGO_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.standalone['x86_64-apple-darwin']['cargo'] }}
          MACOS_X64_RUSTC_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.standalone['x86_64-apple-darwin']['rustc'] }}
          MACOS_X64_STD_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.standalone['x86_64-apple-darwin']['rust-std'] }}
          WINDOWS_X64_CARGO_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.standalone['x86_64-pc-windows-msvc']['cargo'] }}
          WINDOWS_X64_RUSTC_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.standalone['x86_64-pc-windows-msvc']['rustc'] }}
          WINDOWS_X64_STD_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.standalone['x86_64-pc-windows-msvc']['rust-std'] }}
        run: |
          set -euo pipefail

          case "${RUNNER_OS}-$(uname -m)" in
            macOS-arm64)
              rust_target=aarch64-apple-darwin
              cargo_sha256="${MACOS_ARM64_CARGO_SHA256}"
              rustc_sha256="${MACOS_ARM64_RUSTC_SHA256}"
              std_sha256="${MACOS_ARM64_STD_SHA256}"
              ;;
            macOS-x86_64)
              rust_target=x86_64-apple-darwin
              cargo_sha256="${MACOS_X64_CARGO_SHA256}"
              rustc_sha256="${MACOS_X64_RUSTC_SHA256}"
              std_sha256="${MACOS_X64_STD_SHA256}"
              ;;
            Windows-x86_64)
              rust_target=x86_64-pc-windows-msvc
              cargo_sha256="${WINDOWS_X64_CARGO_SHA256}"
              rustc_sha256="${WINDOWS_X64_RUSTC_SHA256}"
              std_sha256="${WINDOWS_X64_STD_SHA256}"
              ;;
            *)
              echo "Unsupported runner architecture: ${RUNNER_OS}-$(uname -m)" >&2
              exit 1
              ;;
          esac

          runner_temp="${RUNNER_TEMP}"
          if [[ "${RUNNER_OS}" == Windows ]]; then
            runner_temp="$(cygpath -u "${RUNNER_TEMP}")"
          fi

          toolchain_root="${runner_temp}/rust-${RUST_VERSION}-${rust_target}"
          install -d -m 0755 "${toolchain_root}"

          install_component() {
            component_name="$1"
            component_sha256="$2"
            archive="${runner_temp}/${component_name}-${RUST_VERSION}-${rust_target}.tar.xz"
            component_dir="${runner_temp}/${component_name}-${rust_target}"
            component_url="https://static.rust-lang.org/dist/${RUST_DIST_DATE}/${component_name}-${RUST_VERSION}-${rust_target}.tar.xz"

            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
              --output "${archive}" "${component_url}"
            if [[ "${RUNNER_OS}" == macOS ]]; then
              echo "${component_sha256}  ${archive}" | shasum -a 256 --check
            else
              echo "${component_sha256}  ${archive}" | sha256sum --check --strict
            fi
            install -d -m 0755 "${component_dir}"
            tar --extract --xz --file "${archive}" --directory "${component_dir}" \
              --strip-components 1
            sh "${component_dir}/install.sh" --prefix="${toolchain_root}" --disable-ldconfig
          }

          install_component rustc "${rustc_sha256}"
          install_component cargo "${cargo_sha256}"
          install_component rust-std "${std_sha256}"

          export PATH="${toolchain_root}/bin:${PATH}"
          if [[ "${RUNNER_OS}" == Windows ]]; then
            cygpath -w "${toolchain_root}/bin" >> "${GITHUB_PATH}"
          else
            echo "${toolchain_root}/bin" >> "${GITHUB_PATH}"
          fi
          rustc_version="$(rustc --version --verbose)"
          cargo_version="$(cargo --version --verbose)"
          echo "${rustc_version}"
          echo "${cargo_version}"
          grep --fixed-strings --line-regexp "release: ${RUST_VERSION}" <<< "${rustc_version}"
          grep --fixed-strings --line-regexp "host: ${rust_target}" <<< "${rustc_version}"
          grep --fixed-strings --line-regexp "release: ${RUST_VERSION}" <<< "${cargo_version}"
          grep --fixed-strings --line-regexp "host: ${rust_target}" <<< "${cargo_version}"
      - name: Run tests
        run: cargo test --locked --all-features
      - name: Analyze all targets
        run: cargo check --locked --all-targets --all-features
      - name: Check reproducible release packaging
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked
          binary=target/debug/dbxctl
          if [[ "${RUNNER_OS}" == Windows ]]; then
            binary=target/debug/dbxctl.exe
          fi
          export SOURCE_DATE_EPOCH=1760000000
          scripts/package-release.sh 0.1.0 "ci-${RUNNER_OS}" "${binary}"
          mv dist first-dist
          scripts/package-release.sh 0.1.0 "ci-${RUNNER_OS}" "${binary}"
          cmp first-dist/*.tar.gz dist/*.tar.gz
          tar --list --gzip --file dist/*.tar.gz >/dev/null

  quality:
    name: Format, lint, test
    runs-on: ubuntu-24.04
    needs: pins
    container:
      image: ${{ needs.pins.outputs.rust_image }}
    env:
      RUST_VERSION: ${{ fromJSON(needs.pins.outputs.json).rust.version }}
      RUSTUP_TOOLCHAIN: ${{ fromJSON(needs.pins.outputs.json).rust.version }}-x86_64-unknown-linux-gnu
    timeout-minutes: 20
    steps:
      - name: Isolate Cargo home in ephemeral storage
        shell: bash
        run: echo "CARGO_HOME=${RUNNER_TEMP}/cargo-home" >> "$GITHUB_ENV"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Rust components
        shell: bash
        env:
          CLIPPY_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.components['clippy'] }}
          CLIPPY_URL: https://static.rust-lang.org/dist/${{ fromJSON(needs.pins.outputs.json).rust.dist_date }}/clippy-${{ fromJSON(needs.pins.outputs.json).rust.version }}-x86_64-unknown-linux-gnu.tar.xz
          LLVM_TOOLS_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.components['llvm-tools'] }}
          LLVM_TOOLS_URL: https://static.rust-lang.org/dist/${{ fromJSON(needs.pins.outputs.json).rust.dist_date }}/llvm-tools-${{ fromJSON(needs.pins.outputs.json).rust.version }}-x86_64-unknown-linux-gnu.tar.xz
          RUSTFMT_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.components['rustfmt'] }}
          RUSTFMT_URL: https://static.rust-lang.org/dist/${{ fromJSON(needs.pins.outputs.json).rust.dist_date }}/rustfmt-${{ fromJSON(needs.pins.outputs.json).rust.version }}-x86_64-unknown-linux-gnu.tar.xz
        run: |
          set -euo pipefail
          rust_sysroot="$(rustc --print sysroot)"

          install_component() {
            component_name="$1"
            component_url="$2"
            component_sha256="$3"
            archive="${RUNNER_TEMP}/${component_name}.tar.xz"
            component_dir="${RUNNER_TEMP}/${component_name}"

            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
              --output "${archive}" "${component_url}"
            echo "${component_sha256}  ${archive}" | sha256sum --check --strict
            install -d -m 0755 "${component_dir}"
            tar --extract --xz --file "${archive}" --directory "${component_dir}" \
              --strip-components 1
            sh "${component_dir}/install.sh" --prefix="${rust_sysroot}" --disable-ldconfig
          }

          install_component clippy "${CLIPPY_URL}" "${CLIPPY_SHA256}"
          install_component llvm-tools "${LLVM_TOOLS_URL}" "${LLVM_TOOLS_SHA256}"
          install_component rustfmt "${RUSTFMT_URL}" "${RUSTFMT_SHA256}"

          cargo clippy --version
          cargo fmt --version
          rustc_version="$(rustc --version --verbose)"
          cargo_version="$(cargo --version --verbose)"
          grep --fixed-strings --line-regexp "release: ${RUST_VERSION}" <<< "${rustc_version}"
          grep --fixed-strings --line-regexp 'host: x86_64-unknown-linux-gnu' \
            <<< "${rustc_version}"
          grep --fixed-strings --line-regexp "release: ${RUST_VERSION}" <<< "${cargo_version}"
          grep --fixed-strings --line-regexp 'host: x86_64-unknown-linux-gnu' \
            <<< "${cargo_version}"
          test -x "${rust_sysroot}/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-profdata"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-features
      - name: Install checksum-pinned coverage tool
        shell: bash
        env:
          TOOL_SHA256: ${{ fromJSON(needs.pins.outputs.json).tools['cargo-llvm-cov'].sha256 }}
          TOOL_URL: https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${{ fromJSON(needs.pins.outputs.json).tools['cargo-llvm-cov'].version }}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          install -d -m 0755 "${RUNNER_TEMP}/dbxctl-tools"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/cargo-llvm-cov.tar.gz" "${TOOL_URL}"
          echo "${TOOL_SHA256}  ${RUNNER_TEMP}/cargo-llvm-cov.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/cargo-llvm-cov.tar.gz" \
            --directory "${RUNNER_TEMP}/dbxctl-tools"
          echo "${RUNNER_TEMP}/dbxctl-tools" >> "${GITHUB_PATH}"
      - name: Measure coverage
        run: cargo llvm-cov --locked --all-features --workspace --ignore-filename-regex '(/rustc/|/tests/)' --fail-under-lines 90
      - name: Analyze all targets
        run: cargo check --locked --all-targets --all-features
      - name: Build dbxctl for upstream contract tests
        run: cargo build --locked
      - name: Check reproducible release packaging
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=1760000000
          scripts/package-release.sh 0.1.0 ci-Linux target/debug/dbxctl
          mv dist first-dist
          scripts/package-release.sh 0.1.0 ci-Linux target/debug/dbxctl
          cmp first-dist/*.tar.gz dist/*.tar.gz
          tar --list --gzip --file dist/*.tar.gz >/dev/null
      - name: Download pinned Databricks CLI
        env:
          DATABRICKS_CLI_VERSION: ${{ fromJSON(needs.pins.outputs.json).databricks_cli.version }}
          DATABRICKS_CLI_SHA256: ${{ fromJSON(needs.pins.outputs.json).databricks_cli.sha256 }}
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output /tmp/databricks-cli.tar.gz \
            "https://github.com/databricks/cli/releases/download/v${DATABRICKS_CLI_VERSION}/databricks_cli_${DATABRICKS_CLI_VERSION}_linux_amd64.tar.gz"
          echo "${DATABRICKS_CLI_SHA256}  /tmp/databricks-cli.tar.gz" \
            | sha256sum --check --strict
          mkdir /tmp/databricks-cli
          tar --extract --gzip --file /tmp/databricks-cli.tar.gz --directory /tmp/databricks-cli
      - name: Check pinned upstream passthrough contract
        env:
          DATABRICKS_CLI_PATH: /tmp/databricks-cli/databricks
        run: cargo test --locked --test upstream_contract -- --ignored

  pin-updater-tests:
    name: Pin updater tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.7"
          check-latest: false
      - name: Verify Python version
        shell: bash
        run: python --version | grep --fixed-strings --line-regexp 'Python 3.13.7'
      - name: Run tests with line coverage
        shell: bash
        run: |
          set -euo pipefail
          coverage_dir="${RUNNER_TEMP}/python-coverage"
          export PYTHONDONTWRITEBYTECODE=1
          python -m trace --count --missing --coverdir "${coverage_dir}" \
            --module unittest discover -s tests -p 'test_*.py' -v
          coverage_file="${coverage_dir}/scripts.update-pins.cover"
          test -s "${coverage_file}"
          awk -v minimum=95 '
            /^[[:space:]]*[0-9]+:/ { hit++ }
            /^>>>>>>/ { miss++ }
            END {
              total = hit + miss
              percent = total ? (100 * hit / total) : 0
              printf "update-pins.py line coverage: %d/%d (%.2f%%)\n", hit, total, percent
              if (percent < minimum) exit 1
            }
          ' "${coverage_file}"

  supply-chain:
    name: CVEs, licenses, dependency policy
    runs-on: ubuntu-24.04
    needs: pins
    container:
      image: ${{ needs.pins.outputs.rust_image }}
    env:
      RUST_VERSION: ${{ fromJSON(needs.pins.outputs.json).rust.version }}
      RUSTUP_TOOLCHAIN: ${{ fromJSON(needs.pins.outputs.json).rust.version }}-x86_64-unknown-linux-gnu
    timeout-minutes: 20
    steps:
      - name: Isolate Cargo home in ephemeral storage
        shell: bash
        run: echo "CARGO_HOME=${RUNNER_TEMP}/cargo-home" >> "$GITHUB_ENV"
      - name: Verify pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc_version="$(rustc --version --verbose)"
          cargo_version="$(cargo --version --verbose)"
          grep --fixed-strings --line-regexp "release: ${RUST_VERSION}" <<< "${rustc_version}"
          grep --fixed-strings --line-regexp 'host: x86_64-unknown-linux-gnu' \
            <<< "${rustc_version}"
          grep --fixed-strings --line-regexp "release: ${RUST_VERSION}" <<< "${cargo_version}"
          grep --fixed-strings --line-regexp 'host: x86_64-unknown-linux-gnu' \
            <<< "${cargo_version}"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned security tools
        shell: bash
        env:
          AUDIT_SHA256: ${{ fromJSON(needs.pins.outputs.json).tools['cargo-audit'].sha256 }}
          AUDIT_VERSION: ${{ fromJSON(needs.pins.outputs.json).tools['cargo-audit'].version }}
          AUDIT_URL: https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${{ fromJSON(needs.pins.outputs.json).tools['cargo-audit'].version }}/cargo-audit-x86_64-unknown-linux-musl-v${{ fromJSON(needs.pins.outputs.json).tools['cargo-audit'].version }}.tgz
          DENY_SHA256: ${{ fromJSON(needs.pins.outputs.json).tools['cargo-deny'].sha256 }}
          DENY_VERSION: ${{ fromJSON(needs.pins.outputs.json).tools['cargo-deny'].version }}
          DENY_URL: https://github.com/EmbarkStudios/cargo-deny/releases/download/${{ fromJSON(needs.pins.outputs.json).tools['cargo-deny'].version }}/cargo-deny-${{ fromJSON(needs.pins.outputs.json).tools['cargo-deny'].version }}-x86_64-unknown-linux-musl.tar.gz
        run: |
          set -euo pipefail
          install -d -m 0755 "${RUNNER_TEMP}/dbxctl-tools"

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/cargo-audit.tgz" "${AUDIT_URL}"
          echo "${AUDIT_SHA256}  ${RUNNER_TEMP}/cargo-audit.tgz" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/cargo-audit.tgz" \
            --directory "${RUNNER_TEMP}/dbxctl-tools" --strip-components 1 \
            "cargo-audit-x86_64-unknown-linux-musl-v${AUDIT_VERSION}/cargo-audit"

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/cargo-deny.tar.gz" "${DENY_URL}"
          echo "${DENY_SHA256}  ${RUNNER_TEMP}/cargo-deny.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/cargo-deny.tar.gz" \
            --directory "${RUNNER_TEMP}/dbxctl-tools" --strip-components 1 \
            "cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"

          chmod 0755 "${RUNNER_TEMP}/dbxctl-tools/cargo-audit" \
            "${RUNNER_TEMP}/dbxctl-tools/cargo-deny"
          echo "${RUNNER_TEMP}/dbxctl-tools" >> "${GITHUB_PATH}"
      - name: Check RustSec advisories
        run: cargo audit --deny warnings
      - name: Check dependency policy
        run: cargo deny check
