name: Release artifacts

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_DIST_SERVER: https://rustup-downloads-disabled.invalid

jobs:
  pins:
    name: Load supply-chain pins
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      json: ${{ steps.pins.outputs.json }}
      rust_image: ${{ steps.pins.outputs.rust_image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.7"
          check-latest: false
      - name: Validate and export pins
        id: pins
        run: python scripts/update-pins.py --emit-github-output "$GITHUB_OUTPUT"

  linux:
    name: Linux x86-64 artifact and attestations
    needs: pins
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.pins.outputs.rust_image }} # zizmor: ignore[unpinned-images] digest-pinned via .github/pins.json
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RUSTUP_TOOLCHAIN: ${{ fromJSON(needs.pins.outputs.json).rust.version }}-x86_64-unknown-linux-gnu
    steps:
      - name: Isolate Cargo home in ephemeral storage
        shell: bash
        run: echo "CARGO_HOME=${RUNNER_TEMP}/cargo-home" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          test -n "${crate_version}"
          if [[ "${tag_version}" != "${crate_version}" ]]; then
            echo "Tag version ${tag_version} does not match Cargo.toml ${crate_version}" >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build locked release binary
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=.
        run: cargo build --release --locked

      - name: Package reproducible release archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          target=x86_64-unknown-linux-gnu
          archive_root="dbxctl-${version}-${target}"
          scripts/package-release.sh "${version}" "${target}" target/release/dbxctl
          echo "ARCHIVE=dist/${archive_root}.tar.gz" >> "$GITHUB_ENV"
          echo "SBOM=dist/${archive_root}.spdx.json" >> "$GITHUB_ENV"
          echo "PACKAGE_ROOT=dist/${archive_root}" >> "$GITHUB_ENV"

      - name: Install checksum-pinned Syft
        shell: bash
        env:
          SYFT_SHA256: ${{ fromJSON(needs.pins.outputs.json).syft.sha256['linux_amd64'] }}
          SYFT_URL: https://github.com/anchore/syft/releases/download/v${{ fromJSON(needs.pins.outputs.json).syft.version }}/syft_${{ fromJSON(needs.pins.outputs.json).syft.version }}_linux_amd64.tar.gz
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/syft.tar.gz" "${SYFT_URL}"
          echo "${SYFT_SHA256}  ${RUNNER_TEMP}/syft.tar.gz" | sha256sum --check --strict
          install -d -m 0755 "${RUNNER_TEMP}/dbxctl-tools"
          tar --extract --gzip --file "${RUNNER_TEMP}/syft.tar.gz" \
            --directory "${RUNNER_TEMP}/dbxctl-tools" syft
          chmod 0755 "${RUNNER_TEMP}/dbxctl-tools/syft"
          echo "${RUNNER_TEMP}/dbxctl-tools" >> "$GITHUB_PATH"

      - name: Generate SPDX SBOM
        shell: bash
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          syft scan "${GITHUB_WORKSPACE}/${PACKAGE_ROOT}" \
            --source-name dbxctl --source-version "${GITHUB_REF_NAME#v}" \
            --output "spdx-json=${SBOM}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Attest SBOM to release archive
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.ARCHIVE }}
          sbom-path: ${{ env.SBOM }}

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dbxctl-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
            ${{ env.SBOM }}
          if-no-files-found: error
          retention-days: 30

  native:
    name: ${{ matrix.name }} artifact and attestations
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-2025
    needs: pins
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Isolate Cargo home in ephemeral storage
        shell: bash
        run: echo "CARGO_HOME=${RUNNER_TEMP}/cargo-home" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-pinned Rust toolchain
        shell: bash
        env:
          RUST_VERSION: ${{ fromJSON(needs.pins.outputs.json).rust.version }}
          RUST_DIST_DATE: ${{ fromJSON(needs.pins.outputs.json).rust.dist_date }}
          SYFT_VERSION: ${{ fromJSON(needs.pins.outputs.json).syft.version }}
          SYFT_DARWIN_ARM64_SHA256: ${{ fromJSON(needs.pins.outputs.json).syft.sha256['darwin_arm64'] }}
          SYFT_DARWIN_AMD64_SHA256: ${{ fromJSON(needs.pins.outputs.json).syft.sha256['darwin_amd64'] }}
          SYFT_WINDOWS_AMD64_SHA256: ${{ fromJSON(needs.pins.outputs.json).syft.sha256['windows_amd64'] }}
          MACOS_ARM64_CARGO_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.standalone['aarch64-apple-darwin']['cargo'] }}
          MACOS_ARM64_RUSTC_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.standalone['aarch64-apple-darwin']['rustc'] }}
          MACOS_ARM64_STD_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.standalone['aarch64-apple-darwin']['rust-std'] }}
          MACOS_X64_CARGO_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.standalone['x86_64-apple-darwin']['cargo'] }}
          MACOS_X64_RUSTC_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.standalone['x86_64-apple-darwin']['rustc'] }}
          MACOS_X64_STD_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.standalone['x86_64-apple-darwin']['rust-std'] }}
          WINDOWS_X64_CARGO_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.standalone['x86_64-pc-windows-msvc']['cargo'] }}
          WINDOWS_X64_RUSTC_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.standalone['x86_64-pc-windows-msvc']['rustc'] }}
          WINDOWS_X64_STD_SHA256: ${{ fromJSON(needs.pins.outputs.json).rust.standalone['x86_64-pc-windows-msvc']['rust-std'] }}
        run: |
          set -euo pipefail

          case "${RUNNER_OS}-$(uname -m)" in
            macOS-arm64)
              rust_target=aarch64-apple-darwin
              cargo_sha256="${MACOS_ARM64_CARGO_SHA256}"
              rustc_sha256="${MACOS_ARM64_RUSTC_SHA256}"
              std_sha256="${MACOS_ARM64_STD_SHA256}"
              syft_archive="syft_${SYFT_VERSION}_darwin_arm64.tar.gz"
              syft_sha256="${SYFT_DARWIN_ARM64_SHA256}"
              ;;
            macOS-x86_64)
              rust_target=x86_64-apple-darwin
              cargo_sha256="${MACOS_X64_CARGO_SHA256}"
              rustc_sha256="${MACOS_X64_RUSTC_SHA256}"
              std_sha256="${MACOS_X64_STD_SHA256}"
              syft_archive="syft_${SYFT_VERSION}_darwin_amd64.tar.gz"
              syft_sha256="${SYFT_DARWIN_AMD64_SHA256}"
              ;;
            Windows-x86_64)
              rust_target=x86_64-pc-windows-msvc
              cargo_sha256="${WINDOWS_X64_CARGO_SHA256}"
              rustc_sha256="${WINDOWS_X64_RUSTC_SHA256}"
              std_sha256="${WINDOWS_X64_STD_SHA256}"
              syft_archive="syft_${SYFT_VERSION}_windows_amd64.zip"
              syft_sha256="${SYFT_WINDOWS_AMD64_SHA256}"
              ;;
            *)
              echo "Unsupported runner architecture: ${RUNNER_OS}-$(uname -m)" >&2
              exit 1
              ;;
          esac

          runner_temp="${RUNNER_TEMP}"
          if [[ "${RUNNER_OS}" == Windows ]]; then
            runner_temp="$(cygpath -u "${RUNNER_TEMP}")"
          fi

          toolchain_root="${runner_temp}/rust-${RUST_VERSION}-${rust_target}"
          install -d -m 0755 "${toolchain_root}"

          install_component() {
            component_name="$1"
            component_sha256="$2"
            archive="${runner_temp}/${component_name}-${RUST_VERSION}-${rust_target}.tar.xz"
            component_dir="${runner_temp}/${component_name}-${rust_target}"
            component_url="https://static.rust-lang.org/dist/${RUST_DIST_DATE}/${component_name}-${RUST_VERSION}-${rust_target}.tar.xz"

            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
              --output "${archive}" "${component_url}"
            if [[ "${RUNNER_OS}" == macOS ]]; then
              echo "${component_sha256}  ${archive}" | shasum -a 256 --check
            else
              echo "${component_sha256}  ${archive}" | sha256sum --check --strict
            fi
            install -d -m 0755 "${component_dir}"
            tar --extract --xz --file "${archive}" --directory "${component_dir}" \
              --strip-components 1
            sh "${component_dir}/install.sh" --prefix="${toolchain_root}" --disable-ldconfig
          }

          install_component rustc "${rustc_sha256}"
          install_component cargo "${cargo_sha256}"
          install_component rust-std "${std_sha256}"

          export PATH="${toolchain_root}/bin:${PATH}"
          if [[ "${RUNNER_OS}" == Windows ]]; then
            cygpath -w "${toolchain_root}/bin" >> "${GITHUB_PATH}"
          else
            echo "${toolchain_root}/bin" >> "${GITHUB_PATH}"
          fi
          rustc_version="$(rustc --version --verbose)"
          cargo_version="$(cargo --version --verbose)"
          echo "${rustc_version}"
          echo "${cargo_version}"
          grep --fixed-strings --line-regexp "release: ${RUST_VERSION}" <<< "${rustc_version}"
          grep --fixed-strings --line-regexp "host: ${rust_target}" <<< "${rustc_version}"
          grep --fixed-strings --line-regexp "release: ${RUST_VERSION}" <<< "${cargo_version}"
          grep --fixed-strings --line-regexp "host: ${rust_target}" <<< "${cargo_version}"

          echo "RUST_TARGET=${rust_target}" >> "${GITHUB_ENV}"
          echo "SYFT_ARCHIVE=${syft_archive}" >> "${GITHUB_ENV}"
          echo "SYFT_SHA256=${syft_sha256}" >> "${GITHUB_ENV}"
          echo "SYFT_VERSION=${SYFT_VERSION}" >> "${GITHUB_ENV}"

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          test -n "${crate_version}"
          if [[ "${tag_version}" != "${crate_version}" ]]; then
            echo "Tag version ${tag_version} does not match Cargo.toml ${crate_version}" >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build locked release binary
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            macOS)
              export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-Wl,-no_uuid"
              ;;
            Windows)
              export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=/Brepro"
              ;;
          esac
          cargo build --release --locked

      - name: Package reproducible release archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive_root="dbxctl-${version}-${RUST_TARGET}"
          binary=target/release/dbxctl
          if [[ "${RUNNER_OS}" == Windows ]]; then
            binary=target/release/dbxctl.exe
          fi
          scripts/package-release.sh "${version}" "${RUST_TARGET}" "${binary}"
          echo "ARCHIVE=dist/${archive_root}.tar.gz" >> "$GITHUB_ENV"
          echo "SBOM=dist/${archive_root}.spdx.json" >> "$GITHUB_ENV"
          echo "PACKAGE_ROOT=dist/${archive_root}" >> "$GITHUB_ENV"

      - name: Install checksum-pinned Syft
        shell: bash
        run: |
          set -euo pipefail
          runner_temp="${RUNNER_TEMP}"
          if [[ "${RUNNER_OS}" == Windows ]]; then
            runner_temp="$(cygpath -u "${RUNNER_TEMP}")"
          fi
          archive="${runner_temp}/${SYFT_ARCHIVE}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${SYFT_ARCHIVE}"
          if [[ "${RUNNER_OS}" == macOS ]]; then
            echo "${SYFT_SHA256}  ${archive}" | shasum -a 256 --check
          else
            echo "${SYFT_SHA256}  ${archive}" | sha256sum --check --strict
          fi
          install -d -m 0755 "${runner_temp}/dbxctl-tools"
          if [[ "${RUNNER_OS}" == Windows ]]; then
            powershell.exe -NoProfile -Command \
              "Expand-Archive -LiteralPath '$(cygpath -w "${archive}")' -DestinationPath '$(cygpath -w "${runner_temp}/dbxctl-tools")'"
            cygpath -w "${runner_temp}/dbxctl-tools" >> "${GITHUB_PATH}"
          else
            tar --extract --gzip --file "${archive}" \
              --directory "${runner_temp}/dbxctl-tools" syft
            chmod 0755 "${runner_temp}/dbxctl-tools/syft"
            echo "${runner_temp}/dbxctl-tools" >> "${GITHUB_PATH}"
          fi

      - name: Generate SPDX SBOM
        shell: bash
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          set -euo pipefail
          scan_root="${GITHUB_WORKSPACE}/${PACKAGE_ROOT}"
          if [[ "${RUNNER_OS}" == Windows ]]; then
            scan_root="$(cygpath -w "$(pwd)/${PACKAGE_ROOT}")"
          fi
          syft scan "${scan_root}" --source-name dbxctl \
            --source-version "${GITHUB_REF_NAME#v}" --output "spdx-json=${SBOM}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Attest SBOM to release archive
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.ARCHIVE }}
          sbom-path: ${{ env.SBOM }}

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dbxctl-${{ github.ref_name }}-${{ env.RUST_TARGET }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
            ${{ env.SBOM }}
          if-no-files-found: error
          retention-days: 30
