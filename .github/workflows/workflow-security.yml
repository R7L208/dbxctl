name: Workflow security

on:
  pull_request:
    paths:
      - ".github/**"
      - requirements/zizmor.txt
      - scripts/workflows.sh
  push:
    branches: [main]
    paths:
      - ".github/**"
      - requirements/zizmor.txt
      - scripts/workflows.sh

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Scan workflows with zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.7"
          check-latest: false
      - name: Verify Python version
        shell: bash
        run: python --version | grep --fixed-strings --line-regexp 'Python 3.13.7'
      - name: Scan workflows
        shell: bash
        env:
          DBXCTL_TOOL_DIR: ${{ runner.temp }}/dbxctl-tools
          # Enables the online audits (impostor-commit, known-vulnerable-actions,
          # ref-confusion). The token is read-only and never written to disk.
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: scripts/workflows.sh check
